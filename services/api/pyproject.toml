[project]
name = "nexus"
version = "0.1.0"
description = "Nexus API, worker and agent runtime"
authors = [
    { name = "Mohan", email = "dskm.madiraju@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.1",
    "databricks-sql-connector>=4.6.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "openai>=3.19.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "python-dotenv>=1.2.3",
    "snowflake-connector-python>=5.0.0",
    "sqlalchemy>=2",
    "sqlglot>=30.23.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
nexus-worker = "nexus.runtime.worker:main"
nexus-seed-demo = "nexus.demo:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S608", "E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]

[tool.pytest.ini_options]
testpaths = ["tests"]
