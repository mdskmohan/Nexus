name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus_owner
          POSTGRES_PASSWORD: nexus_owner_dev
          POSTGRES_DB: nexus
        ports: ["5544:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus_owner -d nexus" --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Create the app role
        run: |
          PGPASSWORD=nexus_owner_dev psql -h localhost -p 5544 -U nexus_owner -d nexus \
            -c "CREATE ROLE nexus_app LOGIN PASSWORD 'nexus_app_dev'"
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
